[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contextwhere"
version = "0.5.0"
description = "Local-first evidence ledger and work-wiki automation for MailWhere, OfficeWhere, and CLI agent context."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "contextWhere"}]

[project.scripts]
contextwhere = "contextwhere.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
