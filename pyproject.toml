[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contextwhere"
version = "0.15.1"
description = "Local-first workspace context OS with scoped evidence, work-wiki automation, and context packs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "contextWhere"}]

[project.scripts]
contextwhere = "contextwhere.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
